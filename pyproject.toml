[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equibirth"
version = "1.0.0"
description = "Predicting preterm birth and auditing racial equity in U.S. maternal health."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Parshv Patel" }]
keywords = ["preterm-birth", "fairness", "responsible-ai", "public-health", "natality"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Declared explicitly rather than inherited. Ruff's default rule set grows between releases, so an
# unpinned linter silently turns clean code red: ruff 0.16 flags 56 new style findings (mostly C408
# dict() literals) that 0.6.9 never raised, none of them defects. Pinning the RULES keeps lint
# reproducible across ruff versions, which is what CI needs. Widen this list deliberately, not by
# upgrading a dependency.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
